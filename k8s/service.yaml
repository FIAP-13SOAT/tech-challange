apiVersion: v1
kind: Service
metadata:
    name: garage-service
    annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
        service.beta.kubernetes.io/aws-load-balancer-internal: "true"
spec:
    selector:
        app: garage-app
    ports:
        - port: 80
          targetPort: 8080
    type: LoadBalancer  # Cria um Load Balancer na AWS

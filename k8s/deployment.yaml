apiVersion: apps/v1
kind: Deployment
metadata:
    name: garage-app
spec:
    selector:
        matchLabels:
            app: garage-app
    template:
        metadata:
            labels:
                app: garage-app
                tags.datadoghq.com/env: "prod"
                tags.datadoghq.com/service: "garage"
                tags.datadoghq.com/version: "1.0.0"
            annotations:
                ad.datadoghq.com/garage-app.logs: '[{"source":"java","service":"garage","log_processing_rules":[{"type":"multi_line","name":"java_stacktrace","pattern":"\\d{4}-\\d{2}-\\d{2}|\\{\"timestamp\""}]}]'
        spec:
            imagePullSecrets:
                - name: ecr-secret
            containers:
                - name: garage-app
                  image: ${ECR_REGISTRY}/garage-app:${IMAGE_TAG}
                  imagePullPolicy: Always
                  ports:
                      - containerPort: 8080
                  env:
                      - name: DB_HOST
                        valueFrom:
                            configMapKeyRef:
                                name: garage-config
                                key: DB_HOST
                      - name: DB_PORT
                        valueFrom:
                            configMapKeyRef:
                                name: garage-config
                                key: DB_PORT
                      - name: DB_NAME
                        valueFrom:
                            configMapKeyRef:
                                name: garage-config
                                key: DB_NAME
                      - name: DB_USER
                        valueFrom:
                            secretKeyRef:
                                name: db-credentials
                                key: username
                      - name: DB_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: db-credentials
                                key: password
                      - name: SPRING_PROFILES_ACTIVE
                        valueFrom:
                            configMapKeyRef:
                                name: garage-config
                                key: SPRING_PROFILES_ACTIVE
                      - name: DD_AGENT_HOST
                        valueFrom:
                            fieldRef:
                                fieldPath: status.hostIP
                      - name: DD_ENV
                        valueFrom:
                            fieldRef:
                                fieldPath: metadata.labels['tags.datadoghq.com/env']
                      - name: DD_SERVICE
                        valueFrom:
                            fieldRef:
                                fieldPath: metadata.labels['tags.datadoghq.com/service']
                      - name: DD_VERSION
                        valueFrom:
                            fieldRef:
                                fieldPath: metadata.labels['tags.datadoghq.com/version']
                      - name: DD_LOGS_INJECTION
                        value: "true"
                      - name: APP_API_GATEWAY_URL
                        valueFrom:
                            configMapKeyRef:
                                name: garage-config
                                key: API_GATEWAY_URL
                  resources:
                      requests:
                          memory: "512Mi"
                          cpu: "250m"
                      limits:
                          memory: "1Gi"
                          cpu: "500m"
                  livenessProbe:
                      httpGet:
                          path: /actuator/health
                          port: 8080
                      initialDelaySeconds: 60
                      periodSeconds: 30
                      timeoutSeconds: 10
                  readinessProbe:
                      httpGet:
                          path: /actuator/health
                          port: 8080
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      timeoutSeconds: 5

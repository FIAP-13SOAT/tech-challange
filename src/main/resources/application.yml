spring:
  application:
    name: garage
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:garage}?currentSchema=public
    username: ${DB_USER:secret}
    password: ${DB_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: public
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    schemas: public
    default-schema: public
    locations: classpath:db/migration

server:
  forward-headers-strategy: framework

api:
  security:
    jwt:
      secret: RLuO//C9BYRwoWXJdtIu6S+QJ/Cl6MEWn9x+h959Ass=

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      env: ${DD_ENV:local}
      service: ${DD_SERVICE:garage}
      version: ${DD_VERSION:dev}
    distribution:
      percentiles:
        http:
          server:
            requests: 0.5,0.9,0.95,0.99
      slo:
        http:
          server:
            requests: 100ms,250ms,500ms,1000ms
    export:
      statsd:
        enabled: true
        host: ${DD_AGENT_HOST:localhost}
        port: 8125
        flavor: datadog
app:
  api-gateway-url: ${APP_API_GATEWAY_URL:}
